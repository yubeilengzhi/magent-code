<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>magent — AI 编程工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Light
            'bg-primary': '#FFFFFF',
            'bg-secondary': '#F7F7F8',
            'bg-tertiary': '#FAFAFA',
            'border': '#E5E7EB',
            'text-primary': '#1F2937',
            'text-secondary': '#6B7280',
            'text-tertiary': '#9CA3AF',
            'disabled': '#A1A1AA',
            'accent': '#3B82F6',
            'accent-hover': '#2563EB',
            'active': '#F1F5F9',
            // Dark
            'd-bg-primary': '#0F0F10',
            'd-bg-secondary': '#17171A',
            'd-bg-tertiary': '#1C1C1F',
            'd-border': '#27272A',
            'd-text-primary': '#FAFAFA',
            'd-text-secondary': '#A1A1AA',
            'd-text-tertiary': '#71717A',
            'd-active': '#1E293B',
          },
          fontFamily: {
            sans: ['Inter', 'SF Pro Display', '-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
            mono: ['JetBrains Mono', 'SF Mono', 'Menlo', 'monospace'],
          },
          fontSize: {
            'title': ['18px', { lineHeight: '24px', fontWeight: '600' }],
            'body': ['14px', { lineHeight: '20px', fontWeight: '400' }],
            'secondary': ['12px', { lineHeight: '16px', fontWeight: '400' }],
          },
          borderRadius: {
            'btn': '8px',
            'input': '8px',
            'card': '12px',
            'container': '16px',
          },
          boxShadow: {
            'subtle': '0 1px 3px rgba(0,0,0,0.05)',
            'card': '0 1px 2px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.04)',
            'popover': '0 4px 16px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.04)',
          },
          transitionDuration: {
            '150': '150ms',
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: 'cv11', 'ss01';
      letter-spacing: -0.01em;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.12); border-radius: 3px; }
    .dark ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.24); }
    .dark .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.24); }
    /* Markdown */
    .md p { margin: 0.5em 0; line-height: 1.7; }
    .md p:first-child { margin-top: 0; }
    .md p:last-child { margin-bottom: 0; }
    .md pre {
      background: #0F172A; color: #E2E8F0;
      padding: 1em 1.2em; border-radius: 8px;
      overflow-x: auto; font-size: 13px; line-height: 1.5;
      margin: 0.75em 0;
    }
    .md code:not(pre code) {
      background: rgba(59, 130, 246, 0.08);
      color: #2563EB;
      padding: 0.1em 0.4em; border-radius: 4px;
      font-size: 0.92em;
      font-family: 'JetBrains Mono', monospace;
    }
    .dark .md code:not(pre code) {
      background: rgba(96, 165, 250, 0.15); color: #93C5FD;
    }
    .md h1, .md h2, .md h3 { font-weight: 600; margin: 1em 0 0.5em; }
    .md h1 { font-size: 1.25em; }
    .md h2 { font-size: 1.1em; }
    .md h3 { font-size: 1em; }
    .md ul, .md ol { padding-left: 1.5em; margin: 0.5em 0; }
    .md li { margin: 0.25em 0; }
    .md a { color: #3B82F6; text-decoration: underline; }
    .md blockquote {
      border-left: 3px solid #E5E7EB;
      padding-left: 1em;
      color: #6B7280;
      margin: 0.75em 0;
    }
    /* Animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade { animation: fadeIn 150ms ease-out; }
    .animate-slide { animation: slideUp 200ms ease-out; }
    /* Typing indicator */
    .typing-dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: 0.4; }
    .typing-dot:nth-child(2) { animation: fadeIn 1.4s ease-in-out infinite 0.2s; }
    .typing-dot:nth-child(3) { animation: fadeIn 1.4s ease-in-out infinite 0.4s; }
  </style>
</head>
<body class="bg-white dark:bg-d-bg-primary text-text-primary dark:text-d-text-primary antialiased h-screen overflow-hidden">
  <div id="app" class="h-full"></div>
  <script src="skills.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
